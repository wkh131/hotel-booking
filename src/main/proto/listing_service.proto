syntax = "proto3";

package wkh131.hotelbooking.listing.v1;

import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/type/interval.proto";
import "google/type/latlng.proto";
import "google/type/money.proto";
import "google/type/phone_number.proto";
import "google/type/postal_address.proto";

option java_package = "com.github.wkh131.hotelbooking.listing.v1";
option java_multiple_files = true;
option java_outer_classname = "ListingServiceProto";

// ============================================================
// SERVICE DEFINITIONS
// ============================================================

// Provides listing capabilities for partners to list and manage
// their properties.
//
// Also provides searching functionality for users to search for
// hotels that can accommodate them.
service ListingService {

  // ==========================================================

  // Gets a partner.
  rpc GetPartner(GetPartnerRequest) returns (Partner) {}

  // Creates a partner that can list hotels under their name.
  //
  // The partner must be authorized before they can start listing.
  rpc CreatePartner(CreatePartnerRequest) returns (Partner) {}

  // Updates a partner.
  rpc UpdatePartner(UpdatePartnerRequest) returns (Partner) {}

  // Deletes a partner.
  //
  // There MUST NOT be any current or upcoming bookings for any hotel registered
  // under this partner.
  // TODO: this would be a cyclic dependency... since booking would depend on search
  rpc DeletePartner(DeletePartnerRequest) returns (google.protobuf.Empty) {}

  // ==========================================================

  // Gets a hotel under a given partner.
  rpc GetHotel(GetHotelRequest) returns (Hotel) {}

  // Creates a hotel under a given partner.
  rpc CreateHotel(CreateHotelRequest) returns (Hotel) {}

  // Updates a hotel.
  rpc UpdateHotel(UpdateHotelRequest) returns (Hotel) {}

  // Deletes a hotel.
  //
  // There MUST NOT be any current or upcoming bookings when called.
  rpc DeleteHotel(DeleteHotelRequest) returns (google.protobuf.Empty) {}

  // Searches for a list of hotels that can accommodate a set of guests
  // for each day in a specified range of dates.
  rpc SearchHotels(SearchHotelsRequest) returns (SearchHotelsResponse) {}

  // ==========================================================

  // Gets a roomType under a given hotel.
  rpc GetRoomType(GetRoomTypeRequest) returns (RoomType) {}

  // Lists the roomTypes under a given hotel.
  rpc ListRoomTypes(ListRoomTypesRequest) returns (ListRoomTypesResponse) {}

  // Creates a roomType under a given hotel.
  rpc CreateRoomType(CreateRoomTypeRequest) returns (RoomType) {}

  // Updates a roomType.
  rpc UpdateRoomType(UpdateRoomTypeRequest) returns (RoomType) {}

  // Deletes a roomType.
  rpc DeleteRoomType(DeleteRoomTypeRequest) returns (google.protobuf.Empty) {}

  // ==========================================================

  // Gets a roomTypeOverride under a given roomType.
  rpc GetRoomTypeOverride(GetRoomTypeOverrideRequest) returns (RoomTypeOverride) {}

  // Lists the roomTypeOverrides under a given roomType.
  rpc ListRoomTypeOverrides(ListRoomTypeOverridesRequest) returns (ListRoomTypeOverridesResponse) {}

  // Creates a roomTypeOverride under a given roomType.
  rpc CreateRoomTypeOverride(CreateRoomTypeOverrideRequest) returns (RoomTypeOverride) {}

  // Updates a roomTypeOverride.
  rpc UpdateRoomTypeOverride(UpdateRoomTypeOverrideRequest) returns (RoomTypeOverride) {}

  // Deletes a roomTypeOverride.
  rpc DeleteRoomTypeOverride(DeleteRoomTypeOverrideRequest) returns (google.protobuf.Empty) {}

  // ==========================================================

  // Gets an amenity.
  rpc GetAmenity(GetAmenityRequest) returns (Amenity) {}

  // Lists the amenities.
  rpc ListAmenities(ListAmenitiesRequest) returns (ListAmenitiesResponse) {}

  // Creates an amenity.
  rpc CreateAmenity(CreateAmenityRequest) returns (Amenity) {}

  // Updates an amenity.
  rpc UpdateAmenity(UpdateAmenityRequest) returns (Amenity) {}

  // Deletes an amenity.
  //
  // This will update all hotels referencing this amenity to remove it.
  /** TODO: do the above? This is because of the many-to-many relation with hotels
        Actually don't need to do that because these are just responses. With the
        normalized data in the db, we only need to delete it in one place. */
  rpc DeleteAmenity(DeleteAmenityRequest) returns (google.protobuf.Empty) {}

  // ==========================================================

  // Gets a photo under a given hotel.
  rpc GetPhoto(GetPhotoRequest) returns (Photo) {}

  // Lists the photos under a given hotel.
  rpc ListPhotos(ListPhotosRequest) returns (ListPhotosResponse) {}

  // Creates a photo under a given hotel.
  rpc CreatePhoto(CreatePhotoRequest) returns (Photo) {}

  // Updates a photo under a given hotel.
  rpc UpdatePhoto(UpdatePhotoRequest) returns (Photo) {}

  // Deletes a photo under a given hotel.
  rpc DeletePhoto(DeletePhotoRequest) returns (google.protobuf.Empty) {}

  // ==========================================================

  // Gets a policyType.
  rpc GetPolicyType(GetPolicyTypeRequest) returns (PolicyType) {}

  // Lists the available policyTypes.
  rpc ListPolicyTypes(ListPolicyTypesRequest) returns (ListPolicyTypesResponse) {}

  // Creates a policyType.
  rpc CreatePolicyType(CreatePolicyTypeRequest) returns (PolicyType) {}

  // Updates a policyType.
  rpc UpdatePolicyType(UpdatePolicyTypeRequest) returns (PolicyType) {}

  // Deletes a policyType.
  rpc DeletePolicyType(DeletePolicyTypeRequest) returns (google.protobuf.Empty) {}

  // ==========================================================

  // Gets a hotelPolicy under a given hotel.
  rpc GetHotelPolicy(GetHotelPolicyRequest) returns (HotelPolicy) {}

  // Lists the hotelPolicies under a given hotel.
  rpc ListHotelPolicies(ListHotelPoliciesRequest) returns (ListHotelPoliciesResponse) {}

  // Creates a hotelPolicy under a given hotel.
  rpc CreateHotelPolicy(CreateHotelPolicyRequest) returns (HotelPolicy) {}

  // Updates a hotelPolicy under a given hotel.
  rpc UpdateHotelPolicy(UpdateHotelPolicyRequest) returns (HotelPolicy) {}

  // Deletes a hotelPolicy under a given hotel.
  rpc DeleteHotelPolicy(DeleteHotelPolicyRequest) returns (google.protobuf.Empty) {}
}

// ============================================================
// RESOURCE MESSAGE DEFINITIONS
// ============================================================

// The hotel partner that lists their hotels and manages them.
message Partner {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/Partner"
    pattern: "partners/{partner}"
  };

  // The resource name of the partner.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The official name that the partner is registered under.
  string title = 2;

  // The postal address of the partner.
  google.type.PostalAddress postal_address = 3;

  // The phone number of the partner.
  google.type.PhoneNumber phone_number = 4;
}

// A property that is owned and listed by a partner.
message Hotel {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/Hotel"
    pattern: "partners/{partner}/hotels/{hotel}"
  };

  // The resource name of the hotel.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // TODO: Add etag for updates (maybe)? is it needed for delete also (don't think so)?
  // TODO: Dont this etag is needed because just do last write wins. it's still correct

  // The official name that this hotel is registered under.
  string title = 2;

  // The postal address of the hotel.
  google.type.PostalAddress  postal_address = 3;

  // The location of the hotel on a map.
  google.type.LatLng location = 4;

  // The phone number of the hotel.
  google.type.PhoneNumber phone_number = 5;

  // The list of amenities that this hotel has.
  repeated string amenities = 6 [(google.api.resource_reference) = {
    type: "listing.hotelbooking.wkh131.github.com/Amenity"
  }];

  // The rating of the hotel
  HotelRating rating = 7;
}

// A set of rooms grouped under a type for a specific hotel.
message RoomType {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/RoomType"
    pattern: "partners/{partner}/hotels/{hotel}/roomTypes/{room_type}"
  };

  // The resource name of the room type.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The official name of the room type.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // The maximum number of guests that a room of this type can hold
  int32 capacity = 3 [(google.api.field_behavior) = REQUIRED];

  // The number of available rooms of this room type.
  int32 count = 4 [(google.api.field_behavior) = REQUIRED];

  // The default price per night for one room of this room type.
  google.type.Money default_price = 5 [(google.api.field_behavior) = REQUIRED];
}

// An override for a contiguous range of dates that specifies, for a specific
// room type, the number of rooms that are available and the price of those rooms.
//
// This should be added for surge prices during weekends or holidays, and also
// for blocking out dates where certain room types are unavailable due to renovations.
message RoomTypeOverride {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/RoomTypeOverride"
    pattern: "partners/{partner}/hotels/{hotel}/roomTypes/{room_type}/overrides/{override}"
  };

  // The resource name of the room type override.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The contiguous range of dates from start (inclusive) to end (inclusive)
  // that these overrides are for.
  //
  // This MUST not intersect with any current range for this room type.
  //
  // If there is an already existing range that intersects this, it is the responsibility
  // of the user to delete and/or update any current ranges and then add this.
  google.type.Interval date_range = 3 [(google.api.field_behavior) = REQUIRED];

  // The number of rooms that are available during the range.
  //
  // This number MUST be less than or equal to the current number of unbooked
  // rooms for this room type for EVERY day in this range. Otherwise, there
  // would be an overbooking.
  //
  // If unspecified or set to 0, then all rooms of this type will be unavailable
  // during this range.
  int32 num_rooms = 4;

  // The price of each room that is available during the range.
  //
  // If unspecified, then uses the default price of the room type.
  google.type.Money price = 5;
}

// An amenity that hotels can offer.
message Amenity {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/Amenity"
    pattern: "amenities/{amenity}"
  };

  // The resource name of the amenity.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The display text for this amenity.
  string display_name = 2;
}

// A photo under a given hotel.
message Photo {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/Photo"
    pattern: "partners/{partner}/hotels/{hotel}/photos/{photo}"
  };

  // The resource name of the photo.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The raw data of the photo.
  //
  // If this is part of a response message, it is not necessarily the
  // exact bytes that were sent when creating the photo.
  bytes data = 2;
}

// A rating for a hotel, usually a star rating.
message HotelRating {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/HotelRating"
    pattern: "partners/{partner}/hotels/{hotel}/rating"
  };

  // The resource name of the rating for a hotel.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The actual rating of this hotel.
  float rating = 2 [(google.api.field_behavior) = REQUIRED];

  // The max value that the rating is out of.
  float out_of = 3 [(google.api.field_behavior) = REQUIRED];
}

// An official policy category.
message PolicyType {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/PolicyType"
    pattern: "policyTypes/policyType"
  };

  // The resource name of the policy type.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // If at least one option exists, then a hotel must only select one of
  // these options and not provide their own description for this type.
  repeated string options = 2;
}

// Policy with hotel-specific custom details pertaining to a policy type.
message HotelPolicy {
  option (google.api.resource) = {
    type: "listing.hotelbooking.wkh131.github.com/HotelPolicy"
    pattern: "partners/{partner}/hotels/{hotel}/policies/{policy}"
  };

  // The resource name of the hotel policy.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The policy type of this policy.
  PolicyType policy_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "listing.hotelbooking.wkh131.github.com/PolicyType"
    }];

  // If the policy type allows mutable details, then this is the hotel-specific
  // details of this policy, otherwise it is one of the options in that policy type
  string details = 3;
}

// ============================================================
// RPC REQUEST AND RESPONSE MESSAGE DEFINITIONS
// ============================================================

// Request message for the GetPartner RPC.
message GetPartnerRequest {
  // The resource name of the partner resource to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "listing.hotelbooking.wkh131.github.com/Partner"
    }];
}

// Request message for the CreatePartner RPC.
message CreatePartnerRequest {
  // The ID to use for the partner, which will become the final component of
  // the partner's resource name.
  //
  // This value should be 4-63 characters, and valid characters
  // are /[a-z][0-9]-/.
  string partner_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The partner to create.
  Partner partner = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for the UpdatePartner RPC.
message UpdatePartnerRequest {
  // The value to override the partner to.
  Partner partner = 1 [(google.api.field_behavior) = REQUIRED];

  /* TODO: If this is same as PUT, then doesn't that break forward compat? or is
      it backwards compat? anyway, when old client updates, it will remove fields written by
       new code !!!! */
}

// Request message for the DeletePartner RPC.
message DeletePartnerRequest {
  // The resource name of the partner resource to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "listing.hotelbooking.wkh131.github.com/Partner"
    }];

  // If set to true, all child resources will also be deleted.
  // Otherwise, the request will only work if it has no child resources.
  bool force = 2;
}

