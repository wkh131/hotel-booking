// Response message for the SearchHotels RPC.
message SearchHotelsResponse {

}

// Request message for the GetRoomType RPC.
message GetRoomTypeRequest {
  // The resource name of the room type resource to get.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "listing.hotelbooking.wkh131.github.com/RoomType"
    }];
}

// Request message for the ListRoomTypes RPC.
message ListRoomTypesRequest {
  // The hotel resource name, which contains a collection of roomTypes.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "listing.hotelbooking.wkh131.github.com/RoomType"
    }];

  // The maximum number of results to return. The service may return fewer than
  // this value.
  // If unspecified, at most 50 will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 2;

  // A page token, received from a previous `ListRoomTypes` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListRoomTypes` must match
  // the call that provided the page token.
  string page_token = 3;
}

// Response message for the ListRoomTypes RPC.
message ListRoomTypesResponse {
  // The roomTypes under the given hotel.
  repeated RoomType room_types = 1;

  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

