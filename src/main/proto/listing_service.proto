}

// Request message for the ListPhotos RPC.
message ListPhotosRequest {
  // The hotel resource name that contains a collection of photos.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "listing.hotelbooking.wkh131.github.com/Photo"
    }];

  // The maximum number of photos to return. The service may return fewer than
  // this value.
  // If unspecified, at most 20 will be returned.
  // The maximum value is 50; values above 50 will be coerced to 50.
  int32 page_size = 2;

  // A page token, received from a previous `ListPhotos` call.
  // Provide this to retrieve the subsequent page.
  //
  // When paginating, all other parameters provided to `ListPhotos`
  // must match the call that provided the page token.
  string page_token = 3;
}

// Response message for the ListPhotos RPC.
message ListPhotosResponse {
