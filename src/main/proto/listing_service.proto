    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      child_type: "listing.hotelbooking.wkh131.github.com/Hotel"
    }];

  // The ID to use for the hotel, which will become the final component of
  // the hotel's resource name.
  //
  // This value should be 4-63 characters, and valid characters
  // are /[a-z][0-9]-/.
  string hotel_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The hotel to create.
  Hotel hotel = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request message for the UpdateHotel RPC.
message UpdateHotelRequest {
  // The value to override the hotel to.
  Hotel hotel = 1 [(google.api.field_behavior) = REQUIRED];

  /* TODO: If this is same as PUT, then doesn't that break forward compat? or is
      it backwards compat? anyway, when old client updates, it will remove fields written by
       new code !!!! */
}

// Request message for the DeleteHotel RPC.
message DeleteHotelRequest {
  // The resource name of the hotel resource to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "listing.hotelbooking.wkh131.github.com/Hotel"
    }];

  // If set to true, all child resources will also be deleted.
